name: Post-deploy indexing

# After every successful Production deployment: tell Bing and Yandex which URLs changed
# (IndexNow – Google does not consume it) and resubmit the sitemap to Search Console
# (hygiene; Google indexes on links and content, not on pings). Both steps are skipped,
# not failed, when their credential is absent.

"on":
  deployment_status:

permissions:
  contents: read

jobs:
  notify:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: IndexNow
        env:
          INDEXNOW_KEY: 0b12a34ebc4e0bbe955eb42d3e0a49f3
        run: node scripts/indexnow-submit.mjs
      # `secrets` is not a valid context in a step `if`, so the presence check runs in a step.
      - name: Check Search Console credential
        id: gsc
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -n "$GSC_SERVICE_ACCOUNT_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Search Console sitemap
        if: steps.gsc.outputs.present == 'true'
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
        run: node scripts/gsc-submit-sitemap.mjs
