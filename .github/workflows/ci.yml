name: CI

"on":
  push:
    branches:
      - main
      - develop
      - "growth/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      # Fast CI matrix intentionally avoids DB setup; provide placeholders for modules that read env.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/boardly_ci_placeholder"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/boardly_ci_placeholder"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: test-nextauth-secret-32chars-min-required-len
      BOARDLY_INTERNAL_SECRET: test-boardly-internal-secret-key-placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint and typecheck (ci:quick)
        run: npm run ci:quick

      # Non-blocking for now (#1147): surfaces known-vulnerability counts in the
      # job log without failing the build. Runs once, not per matrix OS.
      - name: Dependency audit (non-blocking)
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high || true

      # Full suite on Linux (#758 — CI previously ran only 3 smoke files);
      # Windows keeps the fast smoke set as a cross-platform sanity check.
      - name: Run full test suite
        if: matrix.os == 'ubuntu-latest'
        run: npx jest --ci --maxWorkers=100% --workerIdleMemoryLimit=1GB --silent

      - name: Run smoke tests
        if: matrix.os == 'windows-latest'
        run: >-
          npm test -- --ci --runTestsByPath
          __tests__/lib/guest-helpers.test.ts
          __tests__/lib/game-registry.test.ts
          __tests__/lib/lobby-player-requirements.test.ts

  bundle-budget:
    name: Bundle Budget (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build + budget checks do not require a real DB, but some routes instantiate Prisma during build.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/boardly_ci_placeholder"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/boardly_ci_placeholder"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: test-nextauth-secret-32chars-min-required-len
      BOARDLY_INTERNAL_SECRET: test-boardly-internal-secret-key-placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app (production)
        run: npm run build

      - name: Enforce bundle budget
        run: npm run check:bundle-budget
