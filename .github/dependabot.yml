# #1147 — dependency updates for the two ecosystems this repo actually installs from:
# npm packages and the GitHub Actions used in .github/workflows. Weekly, grouped so a
# routine minor/patch bump opens one PR instead of a dozen; a major bump still gets its
# own PR since it can be breaking.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # ts-jest (<7) and typescript-eslint (<6.1) do not accept TypeScript 7 yet.
      - dependency-name: "typescript"
        versions: [">=7"]
      # eslint-plugin-react, -import and -jsx-a11y (via eslint-config-next) cap their eslint peer at 9.
      - dependency-name: "eslint"
        versions: [">=10"]
      # Vercel and CI run Node 22; the types must not describe APIs the runtime lacks.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # Every minor from 22.2 pins a newer API version; moving it needs the webhook endpoint moved with it (#1322).
      - dependency-name: "stripe"
        versions: [">=22.2.0"]
      # 11 inverts the data-collection defaults and moves to span streaming (#1323).
      - dependency-name: "@sentry/nextjs"
        versions: [">=11"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
